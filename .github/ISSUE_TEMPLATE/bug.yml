name: Bug
description: Something does not work as it should.
title: "Bug: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the report. A security problem does not go here: use "Report a security problem" on the new issue page.
        Please use made up data only. No passwords, tokens, keys or details of real people.
  - type: dropdown
    id: where
    attributes:
      label: Where did it happen?
      options:
        - The hosted demo
        - My own copy, self hosted
        - Running it on my computer
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: The steps you took, in order, and what you saw.
      placeholder: |
        1. Open the map
        2. Click a pin
        3. The card stays empty
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What did you expect?
    validations:
      required: true
  - type: input
    id: browser
    attributes:
      label: Browser and device
      placeholder: Firefox on a laptop, Safari on a phone
